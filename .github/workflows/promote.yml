name: Promote PWM Fan Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tested prerelease tag, for example v1.0.0-r1
        required: true

permissions:
  contents: write

concurrency:
  group: pwm-fan-build-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Check and promote release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          case "$RELEASE_TAG" in
            v[0-9A-Za-z._+~-]*-r[0-9]*) ;;
            *) echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac

          prerelease=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.prerelease')
          [ "$prerelease" = true ] || {
            echo "Release is not a prerelease: $RELEASE_TAG" >&2
            exit 1
          }

          mkdir release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release
          for file in pwm-fan-control.apk luci-app-pwm-fan.apk \
            luci-app-pwm-fan-updater.apk sha256sums latest.json install.sh; do
            [ -f "release/$file" ] || {
              echo "Missing release asset: $file" >&2
              exit 1
            }
          done
          (cd release && sha256sum -c sha256sums)

          version=$(jq -er '.version' release/latest.json)
          release=$(jq -er '.release' release/latest.json)
          [ "$RELEASE_TAG" = "v${version}-r${release}" ] || {
            echo 'Release tag does not match latest.json' >&2
            exit 1
          }
          [ "$(jq -er '.channel' release/latest.json)" = stable ] || {
            echo 'Release manifest is not promotion-ready' >&2
            exit 1
          }
          release_base="https://github.com/MayorBug/pwm-fan-builds/releases/download/$RELEASE_TAG"
          package_base="$release_base/"
          jq -er --arg base "$package_base" '
            [.packages.controller.url, .packages.core.url, .packages.updater.url]
            | all(startswith($base))' release/latest.json >/dev/null || {
            echo 'Package URLs do not point to the selected release' >&2
            exit 1
          }
          grep -Fq "$release_base/latest.json" release/install.sh || {
            echo 'Installer does not use the selected release manifest' >&2
            exit 1
          }

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false --latest
